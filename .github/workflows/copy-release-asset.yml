name: Copy Release Asset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download release ZIP
        run: curl -fL "https://github.com/Jhouinho/PhcKnowledge/releases/download/workspace-completo-2026-11-08/workspace-completo.zip" -o workspace-completo.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-completo
          path: workspace-completo.zip
          retention-days: 7
