name: .NET — PhcKnowledgeScanner

on:
  push:
    branches: [main]
    paths:
      - "PhcKnowledge.sln"
      - "global.json"
      - "PhcKnowledgeScanner/**"
      - ".github/workflows/dotnet-scanner.yml"
  pull_request:
    paths:
      - "PhcKnowledge.sln"
      - "global.json"
      - "PhcKnowledgeScanner/**"
      - ".github/workflows/dotnet-scanner.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      PHC_KNOWLEDGE_IKP_OUTPUT: ${{ runner.temp }}/object-index.synthetic.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Restore
        run: dotnet restore PhcKnowledge.sln
      - name: Build
        run: dotnet build PhcKnowledge.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test PhcKnowledge.sln --no-build --configuration Release --logger "console;verbosity=normal"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IKP schema validator
        run: python -m pip install -r tools/ikp-validation/requirements.txt
      - name: Validate C#-generated object index against IKP 0.1 JSON Schema
        run: python tools/ikp-validation/validate_object_index.py "$env:PHC_KNOWLEDGE_IKP_OUTPUT"
