name: .NET — PhcKnowledgeScanner

on:
  push:
    branches: [main]
    paths:
      - "PhcKnowledge.sln"
      - "global.json"
      - "PhcKnowledgeScanner/**"
      - ".github/workflows/dotnet-scanner.yml"
  pull_request:
    paths:
      - "PhcKnowledge.sln"
      - "global.json"
      - "PhcKnowledgeScanner/**"
      - ".github/workflows/dotnet-scanner.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - name: Restore
        run: dotnet restore PhcKnowledge.sln
      - name: Build
        run: dotnet build PhcKnowledge.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test PhcKnowledge.sln --no-build --configuration Release --logger "console;verbosity=normal"
