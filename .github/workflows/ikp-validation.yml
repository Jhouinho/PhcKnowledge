name: IKP 0.1 contract validation

on:
  push:
    branches: [main]
    paths:
      - "docs/architecture/schemas/ikp-0.1/**"
      - "docs/architecture/fixtures/ikp-0.1/**"
      - "tools/ikp-validation/**"
      - ".github/workflows/ikp-validation.yml"
  pull_request:
    paths:
      - "docs/architecture/schemas/ikp-0.1/**"
      - "docs/architecture/fixtures/ikp-0.1/**"
      - "tools/ikp-validation/**"
      - ".github/workflows/ikp-validation.yml"

permissions:
  contents: read

jobs:
  validate-ikp-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install -r tools/ikp-validation/requirements.txt
      - name: Validate reference package
        run: python tools/ikp-validation/validate_ikp_fixture.py docs/architecture/fixtures/ikp-0.1/minimal-valid
      - name: Run positive and negative tests
        run: python -m unittest discover -s tools/ikp-validation -p "test_*.py" -v
