name: SQL Server integration tests

      - name: Run Scanner trigger integration tests against SQL Server 2022
        shell: bash
        env:
          SQLSERVER_CONTAINER_ID: ${{ job.services.sqlserver.id }}
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd"
          SA_PASSWORD="$(docker exec "$SQLSERVER_CONTAINER_ID" printenv MSSQL_SA_PASSWORD)"
          READER_PASSWORD="$(openssl rand -hex 24)Aa1!"

          for attempt in $(seq 1 60); do
            if docker exec "$SQLSERVER_CONTAINER_ID" "$SQLCMD" -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "SQL Server did not become ready in time."
              exit 1
            fi
            sleep 2
          done

          docker exec "$SQLSERVER_CONTAINER_ID" "$SQLCMD" -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "CREATE DATABASE PhcKnowledgeScannerTriggerTests;"
          docker exec "$SQLSERVER_CONTAINER_ID" "$SQLCMD" -S localhost -U sa -P "$SA_PASSWORD" -C -b -Q "CREATE LOGIN phc_scanner_reader WITH PASSWORD = '$READER_PASSWORD';"
          docker exec "$SQLSERVER_CONTAINER_ID" "$SQLCMD" -S localhost -U sa -P "$SA_PASSWORD" -C -b -d PhcKnowledgeScannerTriggerTests -Q "CREATE USER phc_scanner_reader FOR LOGIN phc_scanner_reader; GRANT SELECT ON SCHEMA::dbo TO phc_scanner_reader;"

          export PHC_KNOWLEDGE_SQL_TEST_CONNECTION_STRING="Server=localhost,1433;Database=PhcKnowledgeScannerTriggerTests;User ID=sa;Password=$SA_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          export PHC_KNOWLEDGE_SQL_TEST_RESTRICTED_CONNECTION_STRING="Server=localhost,1433;Database=PhcKnowledgeScannerTriggerTests;User ID=phc_scanner_reader;Password=$READER_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"

          dotnet restore PhcKnowledgeScanner/tests/PhcKnowledgeScanner.Tests/PhcKnowledgeScanner.Tests.csproj
          dotnet test PhcKnowledgeScanner/tests/PhcKnowledgeScanner.Tests/PhcKnowledgeScanner.Tests.csproj --no-restore --configuration Release --filter "FullyQualifiedName~SqlServerTriggerIntegrationTests" --logger "console;verbosity=normal"

on:
  pull_request:
    paths:
      - "PhcKnowledge.sln"
      - "src/PhcKnowledge.Import/**"
      - "tests/PhcKnowledge.Import.SqlServer.Integration.Tests/**"
      - "PhcKnowledgeScanner/**"
      - ".github/workflows/sql-server-integration.yml"
  push:
    branches: [main]
    paths:
      - "PhcKnowledge.sln"
      - "src/PhcKnowledge.Import/**"
      - "tests/PhcKnowledge.Import.SqlServer.Integration.Tests/**"
      - ".github/workflows/sql-server-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sql-server-integration:
    name: SQL Server 2022 — receipt recovery
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "PhcKnowledge_CI_2026!Test"
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Restore SQL Server integration tests
        run: dotnet restore tests/PhcKnowledge.Import.SqlServer.Integration.Tests/PhcKnowledge.Import.SqlServer.Integration.Tests.csproj

      - name: Run integration tests against SQL Server 2022
        run: dotnet test tests/PhcKnowledge.Import.SqlServer.Integration.Tests/PhcKnowledge.Import.SqlServer.Integration.Tests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"
        env:
          PHC_KNOWLEDGE_SQL_TEST_CONNECTION_STRING: "Server=localhost,1433;Database=PhcKnowledgeReceiptTests;User ID=sa;Password=PhcKnowledge_CI_2026!Test;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
